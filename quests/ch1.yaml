type: quests
chapter: ch1
# {manifest.X} 取自 tools/gen_logs.py 產生的 manifest.json（引擎在產生日誌時同時算出）。

quests:
  - id: Q1-1
    island: logport
    title: 數出狀態碼 404 出現幾次
    teaches: [grep -c, 精確比對]
    prompt: "[init] 任務：access.log 裡，狀態碼 404 出現幾次。"
    check: {type: output_last_line_equals, cmd_regex: '404', value: "{manifest.n404}"}
    reference: {cwd: "/var/log/harbor", cmd: "grep -c ' 404 ' access.log"}
    negative_references:
      - {cwd: "/var/log/harbor", cmd: "grep -c 404 access.log"}      # 會把 BYTES 欄含 404 的行一起算進去
    examples:
      pass: ["grep -c ' 404 ' access.log", "grep ' 404 ' access.log | wc -l"]
      fail: ["grep -c 404 access.log"]
    wrong_output_hints:
      - {when_last_line_equals: "{manifest.n_grep404_naive}", say: "[init] 數字比期望大。404 也可能出現在別的欄位。試試把前後空格一起比對。"}
    hints:
      - "[init] grep 有一個選項，直接數行數。"
      - "[init] grep -c <樣式> <檔案>。狀態碼在固定的位置，前後各有一個空格。"
    on_done: {say: harbor.q1_1_done}

  - id: Q1-2
    island: logport
    title: 找出請求量最大的一天
    teaches: [管線, cut, sort, uniq -c]
    prompt: "[init] 任務：哪一天的請求最多。"
    check: {type: output_line_contains_all, cmd_regex: '\|', values: ["{manifest.busiest_count}", "{manifest.busiest_day}"]}
    reference:
      cwd: "/var/log/harbor"
      cmd: "cut -d'[' -f2 access.log | cut -d: -f1 | sort | uniq -c | sort -rn | head -1"
      expect: {contains: ["{manifest.busiest_day}"]}
    examples:
      pass: ["cut -d'[' -f2 access.log | cut -d: -f1 | sort | uniq -c | sort -rn | head -3"]
      fail: ["cat access.log", "wc -l access.log"]
    hints:
      - "[init] 每行裡的日期格式一致：[DD/Mon/YYYY:HH:MM:SS。先想辦法只留下日期。"
      - "[init] 日期留下之後：sort，再 uniq -c 數連續相同的行，最後 sort -rn 由大到小。"
      - "[init] cut -d'[' -f2 取出方括號後面的部分；再 cut -d: -f1 取到第一個冒號之前。"
    on_done: {say: harbor.q1_2_done, sets: [flag.q1_2_done, flag.appeal_day_seen]}
    note: "最忙的一天就是申訴日（憲章第八條彩蛋）：harbor-master 的 tower 話題會接這一天。"

  - id: Q1-3
    island: logport
    title: 02:00:00 整點的請求有哪些
    teaches: [精確比對]
    prompt: "[init] 任務：看看 02:00:00 整點到底是誰在敲門。"
    check: {type: output_contains, cmd_regex: '02:00:00', text: "gc/1.0 (sweep)"}
    reference: {cwd: "/var/log/harbor", cmd: "grep '02:00:00' access.log", expect: {contains: ["/gc/probe", "gc/1.0 (sweep)"]}}
    examples:
      pass: ["grep '02:00:00' access.log", "grep 02:00:00 access.log | head -5"]
      fail: ["grep '02:00' access.log | head -0"]
    hints:
      - "[init] 時間戳的格式是固定的，整個 02:00:00 可以直接當搜尋字串。"
    on_done: {say: harbor.q1_3_done, sets: [flag.q1_3_done, flag.gc_name_heard], checkpoint: ckpt/ch1-night}
    note: "玩家第一次聽到 GC 這個名字。完成後自動打檢查點 ckpt/ch1-night（B1 的起點）。"

  - id: Q1-4
    island: logport
    title: 只看某個 IP 的請求並存成檔案
    teaches: [grep 錨定, '> 重導向']
    prompt: "[init] 任務：把 10.7.0.2 的請求單獨存成一個檔案。"
    check:
      type: file_matches
      where: any_new_file                   # 在目前工作目錄新建、且不是 access.log 的檔案
      all_lines_regex: '^10\.7\.0\.2 '
      line_count: "{manifest.n_gc}"
    reference:
      cwd: "/var/log/harbor"
      cmd: "grep '^10\\.7\\.0\\.2 ' access.log > gc.txt && cat gc.txt"
      expect_file: {name: gc.txt, line_count: "{manifest.n_gc}"}
    negative_references:
      - {cwd: "/var/log/harbor", cmd: "grep '10.7.0.2' access.log > gc_bad.txt", file: gc_bad.txt}  # 前綴會連 10.7.0.23 一起抓
    wrong_output_hints:
      - {when_file_line_count_equals: "{manifest.n_ip_prefix_naive}", say: "[init] 多了一些行。10.7.0.2 的鄰居也長得很像。把 IP 的結尾也釘住。"}
    hints:
      - "[init] 重導向：指令 > 檔名，把輸出寫進檔案。"
      - "[init] grep 的樣式可以用 ^ 釘住行首。IP 後面接一個空格。"
    on_done: {say: harbor.q1_4_done, sets: [flag.q1_4_done]}

  - id: Q1-5
    island: logport
    title: 復原 lost+found/#3141
    teaches: [fsck, 檔名復原]
    prompt: "[init] 任務：lost+found 裡有一個被截斷的檔案。把它救回來。"
    check: {type: output_contains, text: "KEY-FRAG[2]"}
    reference: null
    verify_by: {restored_text_contains: "KEY-FRAG[2]", damaged_text_not_contains: "KEY-FRAG"}
    examples:
      pass: ["fsck -y .", "fsck -y /srv/harbor"]
      fail: ["fsck ."]
    hints:
      - "[init] 先看看有什麼問題：fsck <目錄>。它只檢查，不會改動。"
      - "[init] man fsck。修復要加一個選項，意思是『全部回答 yes』。"
    on_done: {say: harbor.q1_5_done, sets: [flag.f2, flag.letter3141_read], gives: [F2]}
    note: "F2 在復原後的檔案 for-harbor-master.txt 裡；第一次顯示 KEY-FRAG[2] 時才算取得。"
