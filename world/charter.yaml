type: charter
id: charter
title: 島嶼憲章
note: >
  本檔是《島嶼憲章》的完整修訂史（Rev 1–Rev 5）。為避免與世界版本號（v1.x–v5.0，指 Admin 的時代）混淆，
  憲章的版次一律寫成 Rev。遊戲內玩家看到的是 Rev 5；舊版靠 git log -p 與各島傳聞拼出來。
  憲章的作者是 kestrel（v2.x，立法的鷹）；之後每一版都是「上一版出事後的修憲」。
  本檔融入了另一位 Claude 的幽默憲章稿，保持「憲章負責好笑、世界負責冷」的分工。

# 傳說人物（不是 NPC，只出現在傳聞、日誌、憲章修訂事件裡）
legends:
  - {id: xiaolin, name: 小林,   era: v3.x, story: "第 72 小時整點『視同授權』拿走 root 修漏洞，順手把全島桌布換成自己的貓；道歉蛋糕放了三天長毛。史稱蛋糕事件。"}
  - {id: ahong,   name: 阿宏,   era: v3.x, story: "GC 停頓 3.9 秒，他抗辯自己是『慢眨眼體質』，一次眨眼就是 4 秒。經查，當時條文合憲。"}
  - {id: laowang, name: 老王,   era: v3.x, story: "島民對 ferrous 的暱稱。以『菲律賓外海還有一個熱帶性低氣壓，颱風季尚未結束』為由拒絕登出，一路持有 root 到隔年。"}
  - {id: xiaozhou, name: 小周,  era: v4.x, story: "敲鐘那一刻正在借用 root 修漏洞，第四條與第七條打架，全島吵了一下午。"}
  - {id: teashop, name: 手搖店老闆, era: v3.x, story: "兩個新任同毫秒簽收 root，輸的請全島喝飲料，3000 杯訂單塞爆網路，那天剛好戰時斷網；老闆當天成為島上首富。"}
  - {id: cat0,    name: 標準眨眼貓, era: v3.x, story: "值班室的計時標準。眨一次眼 = 150 毫秒。罷工時由備用貓頂班（備用貓：未登記）。"}

# ---------------------------------------------------------------------------
# 版次與世界時代的對應
# ---------------------------------------------------------------------------
revisions:
  - rev: 1
    era: v2.0
    author: kestrel
    label: "kestrel v2.4 原文（舊設定完整保留）"
    incident_before: "（創世）kestrel 為終結第一次島嶼戰的混亂而立憲。原版有缺陷，七條都很短、很硬。"
    articles:
      1: "島嶼由值班員守護，不屬於任何人。"
      2: "日誌不得刪除，只得歸檔。"
      3: "任何持有 root 的操作，須有三名值班員同時在線。"
      4: "發現漏洞者，須先通報，後修補，再公開。"
      5: "戰爭不得斷電。"
      6: "GC 不得被封鎖。"
      7: "root 持有者於季末必須登出，將 root 交還世界。"
    # 這份就是舊版故事聖經 Ch2 的「堡內的憲章（kestrel，v2.4）」。之後的 Rev 2–5 是在這個骨架上長出細則。
    # 骨架句（每條的第一句）永遠不變，所以舊的謎題（Ch2 口令、K1 呼應、第七條比前六條晚三個版本）全部照舊成立。
    surfaced_in: [ch2.v2.4.orig, ch6.git-log]

  - rev: 2
    era: v2.x
    author: kestrel
    incident_before: >
      戰時凌晨三點，島嶼被入侵。值班員想斷網，翻開第五條「戰爭不得斷電」，吵了 40 分鐘：
      斷網算不算斷電？同時第三條要三人在線：一人掛機、一人睡著、一人在吵第五條。
      漏洞整晚開著，GC 還挑最忙的時候停頓。
    articles:
      1: "島嶼不屬於任何人，包括寫這份憲章的人。有人想占為己有，罰抽籤連值一週班。"
      2: "日誌只能歸檔，不能刪除。歸檔後唯讀、可稽核；想改歷史的人，請去改自己的記憶。"
      3: "動用 root 須三名值班員「簽核」，掛機充人頭不算。三人中至少一人必須清醒，咖啡因攝取量可供稽核。"
      4: "發現漏洞者，先通報、後修補、再公開。通報後 72 小時沒人理你，視同授權你自己動手，修完請附一個道歉蛋糕。"
      5: "戰時不得斷「電」，但可以斷「網」。斷網不算斷電，電不知道自己被誤會了。"
      6: "GC 不得被封鎖，單次停頓不得超過一次眨眼，超過者島民有權對該程式扔拖鞋。歸檔日誌一律視為 GC root，永不回收，所以第二條和第六條終於可以握手言和。"
      7: "root 持有者季末必須登出，把 root 還給世界。先交接、後登出，新任簽收了，舊任才能下班。交接期間若同時出現兩個 root，先到者贏，後到者請全島喝飲料。"
      addendum: "本憲章若有條文互相矛盾，以 git blame 查到的人為準，該人須再請一輪飲料。"
    surfaced_in: [ch6.git-log, ch1.harbor-master.charter]

  - rev: 3
    era: v3.x
    author: kestrel      # 作者署名不變；修訂者是「出事後補洞的人」，由 blame 追
    incident_before: >
      小林在第 72 小時整點「視同授權」，拿走 root 修完漏洞，順手把全島桌布換成自己的貓。
      道歉蛋糕放了三天長毛，史稱「蛋糕事件」。同一週 GC 停頓 3.9 秒，值班員阿宏抗辯自己是
      「慢眨眼體質」，一次眨眼就是 4 秒，經查合憲。島民憤而扔拖鞋，砸壞機房兩台風扇。
    changes:
      4: "發現漏洞者，先通報、後修補、再公開。72 小時沒人理你，可以自己動手，但 root 只是「借用」，15 分鐘後自動歸還，逾時 root 會自己回家。借用期間不得改桌布。道歉蛋糕改為道歉布丁，保存期限不得少於一週；過期布丁視同第二次漏洞。"
      6: "GC 不得被封鎖，單次停頓不得超過一次眨眼。一次眨眼 = 150 毫秒，以值班室的「標準眨眼貓」為準，個人體質不得抗辯，貓罷工時由備用貓頂班。違者島民可在日誌裡扔拖鞋（WARN 等級），實體拖鞋禁止進入機房。歸檔日誌仍視為 GC root。"
    world_link: "v3.x：世界第一次 OOM，GC 被迫升級成強制回收，單次停頓因此被拉長。"
    surfaced_in: [ch0.handbook, ch0.cat, ch1.harbor-master.cake, ch1.harbor-master.cat, ch1.error.log]

  - rev: 4
    era: v3.x（末）
    author: kestrel
    incident_before: >
      季末到了，root 持有者老王（ferrous）拒絕登出，理由是「菲律賓外海還有一個熱帶性低氣壓，
      颱風季尚未結束」，一路持有到隔年。另一邊，新任為了搶「先到者贏」，兩人通宵蹲在交接點，
      各寫了搶 root 的腳本，結果同毫秒簽收，兩個 root 各自合法。後到者請全島喝飲料，3000 杯訂單
      把網路塞爆，那天剛好戰時斷網。手搖店老闆當天成為島上首富。
    changes:
      7: "root 是一根接力棒，全島同時只有一根（借用的也算）。「季」以鐘塔敲鐘為準，不接受氣象季、新番季或財報季的任何解釋。敲鐘後 24 小時內必須交棒，沒交的，棒子自己長腳跑掉。新任簽收後，舊任才能下班。出現兩根棒子時，兩根同時作廢，由第三人重新發棒。「後到者請飲料」廢除，飲料各付各的。"
      8: "（新增）全島時間以鐘塔為準。手錶快慢、時區、「我這邊顯示是」均不得作為抗辯。"
    world_link: "ferrous 獨佔十一座島的年代；老王就是 ferrous 的島民暱稱。"
    surfaced_in: [ch1.harbor-master.wang, ch1.harbor-master.drinks, ch1.harbor-master.tower, ch1.access.log.appeal-day]

  - rev: 5
    era: v4.x
    author: kestrel
    incident_before: >
      敲鐘那一刻，小周正在借用 root 修漏洞。第四條說 15 分鐘後歸還，第七條說敲鐘後棒子要交新任，
      棒子該給誰？全島吵了一下午。依附則查 git blame，鍋落到憲章作者頭上，他已累計請了 12 輪飲料。
      於是有人偷偷 git rebase，把 blame 改成別人，違反第二條。
    changes:
      2: "日誌只能歸檔，不能刪除。歸檔後唯讀、可稽核。rebase、force push 視同篡改，該人鍵盤交由全島保管一週（鍵盤也歸檔）。"
      4_append: "借用 root 遇到敲鐘時，棒子直接交新任，借用者轉任「口頭指揮」，由新任代為操作。指揮時不得說「你懂我意思吧」。"
      9: "（新增）修憲須附測試並通過 CI（矛盾檢查、單位檢查、標準眨眼貓同意）。不得在週五下午修憲，違者負責煮下週一早上的咖啡，煮一個月。"
      addendum: "廢除 blame 條款。條文互相矛盾時，兩條同時暫停，由當週值班員抽籤決定誰復活，落選條文須寫悔過書並附單元測試。憲章作者追溯免責，12 輪視同已還清，島民給他一個擁抱，擁抱歸檔。"
    patch_author: lin      # Rev 5 的提交者是 lin（v4.7）；條文作者仍是 kestrel
    patch_version: v4.7
    lin_touches_article_7: >
      舊設定保留：git blame 顯示第七條最後一次被修改的是 lin（v4.7）。在新設定裡，這是 Rev 5 提交的一部分——
      lin 為了解決小周事件，順手重寫了第七條的收尾措辭。amend-7.draft 就是那次的草稿。
    world_link: >
      v4.x，lin 的年代。「擁抱歸檔」在備份冰原的 /var/archive/hugs.log 留有一筆。
      Rev 5 是本季（v5.0）在權限堡 /etc/charter 看到的現行版本。
    surfaced_in: [ch0.handbook, ch2.etc-charter, ch6.hugs-log]

# ---------------------------------------------------------------------------
# 舊設定保留清單（不因新增幽默憲章而刪除任何舊梗）
