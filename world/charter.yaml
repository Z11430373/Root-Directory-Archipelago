# 值班員摘要（燈塔 handbook.md 引用的條文；只列這五條）
handbook_digest:
  - {article: 1, short: "島不屬於任何人，包括寫憲章的人。"}
  - {article: 2, short: "日誌只歸檔，不刪除。"}
  - {article: 3, short: "動用 root 須三名值班員同時簽核。掛機不算人，三人中至少一人必須清醒。"}
  - {article: 6, short: "GC 單次停頓不得超過一次眨眼（150 毫秒，以值班室的標準眨眼貓為準）。"}
  - {article: 9, short: "修憲須附測試並通過 CI。不得在週五下午修憲。"}
  # 刻意不摘：第六條的「GC 不得被封鎖」。B1 的模擬會在玩家真的封鎖時才揭露。

