pending_amendment:
  id: art10
  author: lin
  title: 第十條（草案）
  draft_text: >
    第十條　root 不再是接力棒。root 由八位守鑰者各持一片，任何動用須 k-of-8 簽核。
    第七條相應廢止。
  submitted: "Fri 16:42"            # 週五下午
  ci_result: BLOCKED
  ci_failures:
    - {check: contradiction, detail: "第七條「全島同時只有一根」與第十條「八片各持」互相矛盾"}
    - {check: friday_afternoon, detail: "第九條：不得在週五下午修憲（提交時間 Fri 16:42）"}
    - {check: blink_cat_consent, detail: "標準眨眼貓未同意（罷工中）"}
  consequence: >
    修憲被擋之後，lin 改走工程路線：把 root 拆成八片，用硬連結（ln）綁在各島，GC 無法回收。
    這不是修憲，是繞過修憲。merge 結局（k-of-8 多簽）等於讓第十條真正通過。
  foreshadow:
    - {where: ch0.notes/.draft.txt, how: "P.S. 我這週五下午想改一條憲章。CI 說不行。"}
    - {where: ch0..bash_history, how: "vi amend-10.draft / git push origin amend/art-10 / cat /var/log/ci/last.txt"}
    - {where: ch2./etc/charter.d/amend-10.draft, how: "Ch2 遺物：草案全文（與舊稿 amend-7.draft 並存，兩個都保留）"}
    - {where: ch6.git-blame, how: "git blame：第七條 = lin（v4.7，舊設定）；另有草案被 CI 擋下的紀錄，作者 lin。Rev 5 起 blame 條款已廢除，所以只能當證據不能當判決"}
