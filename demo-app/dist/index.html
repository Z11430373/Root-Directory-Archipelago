/* Control boundaries are stronger than decorative panel separators. */
:root{--control-line:#6b826f}
:root[data-theme=contrast]{--control-line:#344435}
button,input,textarea,select{border-color:var(--control-line)}
#command-input{border-bottom:1px solid var(--control-line)}
.task-panel>summary{pointer-events:auto;cursor:pointer;list-style:revert}
.keyboard-help{flex-shrink:0;font-size:11px;line-height:1.5;color:var(--muted);margin:2px 0 0}
.terminal:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}
@media(max-width:760px){

  .keyboard-help{font-size:10px}
}

/* Server console: layout and color only. No simulated boot messages or new story. */
